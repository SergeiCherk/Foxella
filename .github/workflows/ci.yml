name: CI

on:
  push:
  pull_request:

# Read-only token: the jobs only check out and test the code.
permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install dependencies
        run: uv sync --locked
      - name: Ruff lint
        run: uv run ruff check .
      - name: Ruff format
        run: uv run ruff format --check .
      - name: Mypy
        run: uv run mypy src/
      - name: Tests with coverage
        run: uv run pytest --cov
      - name: Coverage of core/ (at least 90 %)
        run: uv run coverage report --include="src/nutrition_bot/core/*" --fail-under=90

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          curl -sSfL -o gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz
          echo "9991e0b2903da4c8f6122b5c3186448b927a5da4deef1fe45271c3793f4ee29c  gitleaks.tar.gz" | sha256sum --check
          tar -xz -f gitleaks.tar.gz gitleaks
      - name: Scan the whole git history for secrets
        run: ./gitleaks git --redact -v --exit-code 2
