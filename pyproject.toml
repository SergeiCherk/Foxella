[project]
name = "nutrition-bot"
version = "0.1.0.dev0"
description = "Foxella: a Telegram bot that plans meals in household measures, without a kitchen scale."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "aiogram>=3.31.0",
    "aiosqlite>=0.22.1",
    "alembic>=1.20.1",
    "openai>=3.49.0",
    "pydantic-settings>=2.16.2",
    "pymorphy3>=2.0.6",
    "pymorphy3-dicts-ru>=2.4.417150.4580142",
    "rapidfuzz>=3.14.6",
    "sqlalchemy[asyncio]>=2",
]

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pre-commit>=4.7.0",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1.post1",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nutrition_bot"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "C4", "RUF", "PT"]
# Russian texts: Cyrillic letters that look like Latin ones are expected, not a bug.
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"alembic/versions/*.py" = ["E501", "W291", "UP007"]  # generated by Alembic

[tool.mypy]
python_version = "3.12"
files = ["src"]
plugins = ["pydantic.mypy"]
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
check_untyped_defs = true

# Strict mode only for the pure business logic (see docs/decisions.md).
[[tool.mypy.overrides]]
module = "nutrition_bot.core.*"
strict = true

[[tool.mypy.overrides]]
module = ["pymorphy3.*", "rapidfuzz.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "--cov=nutrition_bot --cov-report=term-missing --cov-fail-under=80"

[tool.coverage.run]
source = ["src/nutrition_bot"]
branch = true

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "if __name__ == .__main__.:", "if TYPE_CHECKING:"]
